<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f4ee">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="浮光">
  <meta name="description" content="把此刻轻轻记下。只在本机保存的私人心情与生活记录。">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' https:; font-src 'none'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>浮光 · 把此刻轻轻记下</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./weather.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div class="ambient" aria-hidden="true"></div>
  <div class="app-shell">
  <div id="page-scroll" class="page-scroll">
  <header class="app-header">
    <a href="#now" class="brand" aria-label="浮光，回到此刻"><span class="brand-mark" aria-hidden="true">◒</span><span>浮光<small>F U G U A N G</small></span></a>
    <button class="local-status" data-action="privacy"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 10V7a5 5 0 0 1 10 0v3M6 10h12v10H6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>本机存储</button>
  </header>
  <main id="main" tabindex="-1"><p class="loading">正在打开你的留白…</p></main>
  </div>
  <nav class="tabbar" aria-label="主要导航">
    <button data-tab="now" aria-current="page"><span data-icon="sun"></span><span>此刻</span></button>
    <button data-tab="history"><span data-icon="book"></span><span>拾记</span></button>
    <button data-tab="review"><span data-icon="wave"></span><span>回望</span></button>
    <button data-tab="settings"><span data-icon="leaf"></span><span>我的</span></button>
  </nav>
  </div>
  <dialog id="editor" aria-labelledby="editor-title"></dialog>
  <dialog id="confirm" class="confirm-dialog" aria-labelledby="confirm-title"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>浮光需要启用 JavaScript，才能把记录保存在此设备。</noscript>
</body>
</html>
